# Render Blueprint — the LIVE topology: a combined backend web service running all
# five FastAPI apps in one process (koel.combined:app, fits the free/small tier's
# 512MB limit) PLUS a `koel-dashboard` static site for the Vite SPA frontend. The five-service split (independently scalable) is preserved
# in render.split.yaml for the Phase-2 scale-out (docs/PRODUCTION_MASTERPLAN.md).
#
# Region `ohio` (us-east) co-locates inference with Groq/NVIDIA (~ms) instead of
# crossing the Pacific per hop (~250ms); only the browser↔backend leg crosses the
# ocean. Sarvam (India-hosted) is the exception — see docs/RESIDENCY.md.
#
# FREE-TIER CAVEAT: `plan: free` spins down after 15 min idle (~50s cold start)
# and caps at 512MB RAM. The in-app keep-alive (self-ping) + a GitHub Actions cron
# offset spin-down; `plan: starter` removes it outright. See docs/DEPLOY.md.
#
# Secrets (KOEL_GROQ_API_KEY, KOEL_NVIDIA_API_KEY, KOEL_SARVAM_API_KEY, KOEL_JWT_SECRET,
# KOEL_SECRET_KEY — the Fernet key for BYOK model-connection encryption, see
# docs/SECURITY.md) are set in the Render dashboard / a synced env group — never
# committed. KOEL_SECRET_KEY is easy to miss since BYOK fails closed silently
# (no error, connections just never resolve) rather than refusing to boot.

services:
  - type: web
    name: koel-backend           # live Render service name (serves the whole combined app)
    runtime: docker
    region: ohio
    plan: starter                # free works for a warm demo; starter avoids spin-down
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    # One process serves every service (mounted under /stt, /nlp, /tts, /crm and
    # voicebot at /). It self-migrates + self-seeds on boot (koel/combined.py
    # _ensure_schema), since the free tier has no pre-deploy hook.
    dockerCommand: uvicorn koel.combined:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KOEL_ENVIRONMENT
        value: production
      # Combined process: the fan-out reaches the other apps in-process over
      # localhost at their mount prefixes (koel/combined.py).
      - key: KOEL_STT_SVC_URL
        value: http://localhost:$PORT/stt
      - key: KOEL_NLP_SVC_URL
        value: http://localhost:$PORT/nlp
      - key: KOEL_TTS_SVC_URL
        value: http://localhost:$PORT/tts
      - key: KOEL_CRM_SVC_URL
        value: http://localhost:$PORT/crm
      - key: KOEL_STREAM_TTS
        value: "true"
      - key: KOEL_SARVAM_TTS_WS_ENABLED
        value: "true"
      - key: KOEL_SMART_TURN_ENABLED
        value: "true"
      - fromGroup: koel-secrets   # KOEL_GROQ_API_KEY, KOEL_NVIDIA_API_KEY, KOEL_SARVAM_API_KEY,
                                  # KOEL_JWT_SECRET, KOEL_SECRET_KEY (BYOK — see header comment above)
      # Google Sign-In (optional, allowlist model). Set these in the Render
      # dashboard (NOT committed) to enable POST /v1/auth/google; unset ⇒ Google
      # login is off and the password/demo path is unchanged:
      #   KOEL_GOOGLE_CLIENT_ID   — the OAuth Web client id (also VITE_GOOGLE_CLIENT_ID on koel-dashboard)
      #   KOEL_GOOGLE_ALLOWLIST   — CSV of `email[:org_id[:role]]`; the SOLE allowlist (removing an email revokes it on next deploy)
      # CORS is set at the SERVICE level on the live backend (dashboard + legacy origins).
      - key: KOEL_CORS_ALLOW_ORIGINS
        value: https://koel-voice-bot.onrender.com,https://koel-dashboard.onrender.com
      - key: KOEL_DATABASE_URL
        fromDatabase: { name: koel-postgres, property: connectionString }
      - key: KOEL_REDIS_URL
        fromService: { name: koel-redis, type: keyvalue, property: connectionString }
      # O-8: share the auth/session rate-limit window across workers + instances
      # via Redis (in-memory would multiply the limit by process count).
      - key: KOEL_RATE_LIMIT_BACKEND
        value: "redis"

  # Frontend dashboard — the Vite SPA, served as a Render static site. This was
  # missing from the blueprint, so the deploy only ever served the backend API at
  # `/` (hitting the URL showed no dashboard). VITE_KOEL_API is inlined at BUILD
  # time (Vite), so Render must set it before `buildCommand` — it does.
  # Live URL: https://koel-dashboard.onrender.com — already in the backend's
  # KOEL_CORS_ALLOW_ORIGINS (service-level). Update VITE_KOEL_API if the backend
  # URL changes (Render assigns a per-service suffix).
  - type: web
    name: koel-dashboard
    runtime: static
    region: ohio
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_KOEL_API
        value: https://koel-backend-oj5p.onrender.com   # live backend origin (Render-assigned suffix)
      # Google Sign-In (optional): set VITE_GOOGLE_CLIENT_ID in the dashboard to
      # the SAME OAuth client id as the backend's KOEL_GOOGLE_CLIENT_ID. It is
      # inlined at BUILD time, so a change requires a redeploy of this static
      # site. Unset ⇒ the "Sign in with Google" button is not rendered.
    routes:
      # SPA fallback so a refresh/deep-link still serves the app shell.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue        # managed Redis (session store)
    name: koel-redis
    region: ohio
    plan: starter
    ipAllowList: []       # private only

databases:
  - name: koel-postgres   # managed Postgres; the combined app enables `vector` + runs `alembic upgrade head` on boot
    region: ohio
    plan: basic-256mb
