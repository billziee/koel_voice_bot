# Local dev/demo stack. Brings up Postgres+pgvector and Redis; the five Python
# services run from one image on different ports (uvicorn module per service).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: koel
      POSTGRES_PASSWORD: koel
      POSTGRES_DB: koel
    # Host port is configurable to avoid clashes with other local Postgres
    # instances; services reach it as `postgres:5432` on the internal network.
    ports:
      - "${KOEL_PG_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  base: &svc
    build: .
    image: koel-backend:latest
    env_file: .env
    environment:
      KOEL_REDIS_URL: redis://redis:6379/0
      KOEL_DATABASE_URL: postgresql+asyncpg://koel:koel@postgres:5432/koel
      KOEL_STT_SVC_URL: http://stt:8101
      KOEL_NLP_SVC_URL: http://nlp:8102
      KOEL_TTS_SVC_URL: http://tts:8103
      KOEL_CRM_SVC_URL: http://crm:8104
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    profiles: ["never"]  # template only; concrete services below

  stt:
    <<: *svc
    profiles: []
    command: uvicorn koel.stt.main:app --host 0.0.0.0 --port 8101
    ports: ["8101:8101"]

  nlp:
    <<: *svc
    profiles: []
    command: uvicorn koel.nlp.main:app --host 0.0.0.0 --port 8102
    ports: ["8102:8102"]

  tts:
    <<: *svc
    profiles: []
    command: uvicorn koel.tts.main:app --host 0.0.0.0 --port 8103
    ports: ["8103:8103"]

  crm:
    <<: *svc
    profiles: []
    command: uvicorn koel.crm.main:app --host 0.0.0.0 --port 8104
    ports: ["8104:8104"]

  voicebot:
    <<: *svc
    profiles: []
    command: uvicorn koel.voicebot.main:app --host 0.0.0.0 --port 8100
    ports: ["8100:8100"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
