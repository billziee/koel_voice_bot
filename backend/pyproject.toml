[project]
name = "koel-backend"
version = "1.2.0"
description = "KOEL Voice Bot — FastAPI backend: orchestrator + STT/NLP/TTS/CRM microservices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",  # [asyncio] pulls greenlet, required by the async engine
    "alembic>=1.13",  # schema migrations (O) — retires create_all in prod
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "httpx[http2]>=0.27",  # http2 → h2, for keep-alive + multiplexed provider calls
    "websockets>=12.0",
    "numpy>=1.26",  # synthesized ambient babble bed (koel.tts.mixer)
    "nvidia-riva-client>=2.15",  # NVIDIA Magpie TTS (Hindi) over NVCF gRPC
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",  # extract text from uploaded PDF knowledge files (pure-python)
]

[project.optional-dependencies]
# Semantic end-of-turn gate (smart-turn v3.2 ONNX) — see pipeline/endpointing.py.
smart-turn = ["onnxruntime>=1.20"]
# Local ONNX CPU embedder (O-4) — see nlp/rag.py FastEmbedEmbedder. Opt-in so the
# default image stays lean; set KOEL_NLP_EMBEDDER=fastembed + run scripts/reembed_kb.py.
local-embed = ["fastembed>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",  # coverage gate in CI (R)
    "aiosqlite>=0.20",  # in-memory SQLAlchemy engine for integration tests
    "markdown>=3.5",  # docs/build_html.py renders HLD/LLD markdown → HTML
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["koel*"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Alembic autogenerates verbose column DDL; don't lint generated migration bodies.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# UP042: we use `(str, Enum)` deliberately for broad serialization compatibility
# rather than 3.11 StrEnum. B008: FastAPI Depends() in defaults is idiomatic.
ignore = ["UP042", "B008"]

[tool.mypy]
python_version = "3.11"
# Optional/native deps ship no type stubs (fastembed, onnxruntime, riva) — treat
# their imports as Any rather than failing the whole check on a missing stub.
ignore_missing_imports = true

# Graduation allowlist (Q-5): mypy is a BLOCKING gate in CI, but these modules
# still carry pre-existing type errors (a Localized|LocalizedList union in the
# localization stack; audioop.binascii attr access; a FastAPI lifespan variance).
# They're silenced here so the gate protects every OTHER module today; the list
# is only allowed to SHRINK — never add a module to buy silence for new code.
[[tool.mypy.overrides]]
module = [
    "koel.common.app_factory",
    "koel.stt.providers",
    "koel.voicebot.main",
    "koel.voicebot.ws.handler",
    "koel.voicebot.pipeline.orchestrator",
    "koel.voicebot.pipeline.silence",
    "koel.voicebot.pipeline.filler",
    "koel.voicebot.pipeline.endpointing",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Coverage gate (R) — run in CI as: pytest --cov (config below applies).
# Not in default addopts so local `pytest` stays fast and pytest-cov-optional.
[tool.coverage.run]
source = ["koel"]
omit = ["koel/*/main.py", "*/__init__.py"]

[tool.coverage.report]
# Achieved ~90%; the gate is set a few points below as a floor so ordinary
# refactors don't trip CI while new/undertested code still fails the build. The
# uncovered remainder is infra-bound (pgvector KB endpoints, Magpie gRPC) and is
# exercised by the CI service-container run + live verification, not unit mocks.
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__"]
