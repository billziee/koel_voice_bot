[project]
name = "koel-backend"
version = "1.2.0"
description = "KOEL Voice Bot — FastAPI backend: orchestrator + STT/NLP/TTS/CRM microservices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42.0",  # Fernet — BYOK model-connection key encryption at rest
    "bcrypt>=4.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",  # [asyncio] pulls greenlet, required by the async engine
    "alembic>=1.13",  # schema migrations (O) — retires create_all in prod
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "httpx[http2]>=0.27",  # http2 → h2, for keep-alive + multiplexed provider calls
    "websockets>=12.0",
    "numpy>=1.26",  # synthesized ambient babble bed (koel.tts.mixer)
    "nvidia-riva-client>=2.15",  # NVIDIA Magpie TTS (Hindi) over NVCF gRPC
    "boto3>=1.34.100",  # AWS Bedrock Titan Embeddings V2 (RAG) + SageMaker Whisper/Orpheus runtime.invoke_endpoint
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",  # extract text from uploaded PDF knowledge files (pure-python)
]

[project.optional-dependencies]
# Semantic end-of-turn gate (smart-turn v3.2 ONNX) — see pipeline/endpointing.py.
smart-turn = ["onnxruntime>=1.20"]
# Local ONNX CPU embedder (O-4) — see nlp/rag.py FastEmbedEmbedder. Opt-in so the
# default image stays lean; set KOEL_NLP_EMBEDDER=fastembed + run scripts/reembed_kb.py.
local-embed = ["fastembed>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",  # coverage gate in CI (R)
    "aiosqlite>=0.20",  # in-memory SQLAlchemy engine for integration tests
    "markdown>=3.5",  # docs/build_html.py renders HLD/LLD markdown → HTML
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["koel*"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Alembic autogenerates verbose column DDL; don't lint generated migration bodies.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# UP042: we use `(str, Enum)` deliberately for broad serialization compatibility
# rather than 3.11 StrEnum. B008: FastAPI Depends() in defaults is idiomatic.
ignore = ["UP042", "B008"]

[tool.mypy]
python_version = "3.11"
# NOTE: ignore_missing_imports is deliberately NOT set globally — a global flag
# also hides missing FIRST-PARTY koel.* modules (a stale/renamed internal import
# silently becomes Any and the blocking gate passes on broken code). It is scoped
# per-library below to ONLY the optional native deps that ship no type stubs.

# Optional/native third-party deps without type stubs. Scoped so a real
# unresolvable koel.* import still fails the gate.
[[tool.mypy.overrides]]
module = [
    "fastembed.*",
    "onnxruntime", "onnxruntime.*",
    "riva.*",
    "pgvector.*",
    "boto3", "boto3.*", "botocore.*",
    "jose", "jose.*",
]
ignore_missing_imports = true

# Graduation allowlist (Q-5): mypy is a BLOCKING gate. Every pre-existing
# first-party type error has been FIXED (localization is now generically typed
# via register(); binascii.Error is imported directly; the smart-turn session is
# narrowed) rather than blanket-silenced, so this list is EMPTY — the gate now
# type-checks every module, new code included. If a genuinely-hard error ever
# needs silencing, prefer a line-level `# type: ignore[code]` over re-adding a
# whole module here.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Coverage gate (R) — run in CI as: pytest --cov (config below applies).
# Not in default addopts so local `pytest` stays fast and pytest-cov-optional.
[tool.coverage.run]
source = ["koel"]
omit = ["koel/*/main.py", "*/__init__.py"]
# SQLAlchemy's async ORM bridges every await through `greenlet` internally (Core
# is sync under the hood even for async drivers like aiosqlite/asyncpg) — without
# telling coverage.py about that, its tracer loses sync on the greenlet switch
# and silently under-reports everything from that point in the coroutine onward.
# This was previously making DB-touching routes across the codebase (users.py,
# orgs.py, knowledge.py, auth.py, ...) look far less tested than they actually
# are — e.g. users.py measured 70% (65 "missing" lines) when every one of those
# lines was demonstrably executing (verified via a raw sys.settrace probe
# bypassing coverage.py entirely). `thread` is included alongside `greenlet`
# per coverage's own docs recommendation when both are in play (aiosqlite runs
# its DBAPI calls on a background thread; OTel's span processor does too).
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# Achieved ~90%; the gate is set a few points below as a floor so ordinary
# refactors don't trip CI while new/undertested code still fails the build. The
# uncovered remainder is infra-bound (pgvector KB endpoints, Magpie gRPC) and is
# exercised by the CI service-container run + live verification, not unit mocks.
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__"]
